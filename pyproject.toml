[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-data-cleaner"
version = "0.2.0"
description = "Intelligent Document Processing SDK — extract, clean, normalize, deduplicate, translate and export data from CSV, TXT, JSON, Excel and PDF"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Intelligent Data Cleaner Contributors"}
]
keywords = ["data-cleaning", "document-processing", "normalization", "deduplication", "sdk", "csv", "pdf", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=16.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "fpdf2>=2.7",
    "pdfplumber>=0.9",
    "pdfminer.six>=20231228",
    "xlsxwriter>=3.1",
    "fonttools>=4.43",
    "pillow>=10.0",
    "duckdb>=1.0",
    "rich>=13.0",
    "ftfy>=6.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "deep-translator>=1.11",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
cli = [
    "typer>=0.9",
]
all = [
    "typer>=0.9",
    "openpyxl>=3.1",
]

[project.scripts]
idoc = "src.cli:app"

[project.urls]
Homepage = "https://github.com/Lidiya-Mikhailova/intelligent-data-cleaner"
Repository = "https://github.com/Lidiya-Mikhailova/intelligent-data-cleaner"
Issues = "https://github.com/Lidiya-Mikhailova/intelligent-data-cleaner/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
